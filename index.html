<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClassBunk | Smart Attendance & Target Tracker</title>
  <!-- SVG Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%234f46e5'/><path d='M25 42 L50 30 L75 42 L50 54 Z' fill='%23ffffff'/><path d='M33 48 L33 65 C33 70, 67 70, 67 65 L67 48' fill='none' stroke='%23ffffff' stroke-width='4' stroke-linecap='round'/><circle cx='75' cy='52' r='3' fill='%23fbbf24'/><path d='M75 55 L75 66' stroke='%23fbbf24' stroke-width='2'/></svg>">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              900: '#312e81',
            },
            bunk: {
              safe: '#10b981',
              warning: '#f59e0b',
              danger: '#ef4444',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }
    .glass-panel {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.5);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .glass-card:hover {
      border-color: rgba(99, 102, 241, 0.3);
      transform: translateY(-2px);
    }
    .progress-ring-circle {
      transition: stroke-dashoffset 0.5s ease-in-out;
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(99, 102, 241, 0.4);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(99, 102, 241, 0.7);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-brand-500 selection:text-white">

  <!-- Header / Navigation -->
  <header class="sticky top-0 z-40 glass-panel border-b border-slate-800/80 px-4 lg:px-8 py-3">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <!-- SVG Logo -->
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 via-indigo-500 to-purple-500 flex items-center justify-center shadow-lg shadow-brand-500/20">
          <svg class="w-6 h-6 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
            <path d="M6 12v5c3 3 9 3 12 0v-5"/>
          </svg>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="font-black text-xl tracking-tight bg-gradient-to-r from-white via-slate-200 to-brand-100 bg-clip-text text-transparent">ClassBunk</h1>
            <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-brand-500/20 text-brand-100 border border-brand-500/30">v2.0</span>
          </div>
          <p class="text-xs text-slate-400 font-medium hidden sm:block">Smart Attendance & Target Engine</p>
        </div>
      </div>
      
      <div class="flex items-center gap-2">
        <button onclick="openModal('addSubjectModal')" class="flex items-center gap-2 bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-500 hover:to-indigo-500 text-white font-semibold text-xs sm:text-sm px-4 py-2 rounded-xl shadow-md shadow-brand-600/30 transition-all active:scale-95">
          <i class="fa-solid fa-plus"></i>
          <span>Add Subject</span>
        </button>
        <button onclick="resetToSampleData()" title="Reset Sample Data" class="p-2 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 transition-colors">
          <i class="fa-solid fa-rotate"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 lg:px-8 py-6 w-full flex-grow space-y-8">
    
    <!-- Top Summary Dashboard Metrics -->
    <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
      <!-- Overall Percentage Ring Card -->
      <div class="glass-card p-5 rounded-2xl flex items-center justify-between">
        <div class="space-y-1">
          <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Overall Attendance</p>
          <h2 id="overallPctText" class="text-3xl font-extrabold text-white">0%</h2>
          <p id="overallCountsText" class="text-xs text-slate-400">0 of 0 classes attended</p>
        </div>
        <div class="relative w-16 h-16 flex items-center justify-center">
          <svg class="w-16 h-16 transform -rotate-90">
            <circle cx="32" cy="32" r="26" stroke="rgba(255,255,255,0.1)" stroke-width="6" fill="transparent"/>
            <circle id="overallProgressCircle" class="progress-ring-circle" cx="32" cy="32" r="26" stroke="#6366f1" stroke-width="6" stroke-dasharray="163.36" stroke-dashoffset="163.36" stroke-linecap="round" fill="transparent"/>
          </svg>
          <i class="fa-solid fa-graduation-cap absolute text-slate-400 text-xs"></i>
        </div>
      </div>

      <!-- Health Badge Card -->
